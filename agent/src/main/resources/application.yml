spring:
  application:
    name: celestia-agent

  # SPEC-008: MySQL 8.4 via Flyway. Credentials come from the environment
  # (DB_URL / DB_USER / DB_PASSWORD); the defaults are for a local dev MySQL.
  # Secrets are never literal in this file.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/celestia?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:celestia}
    password: ${DB_PASSWORD:celestia}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# SPEC-009: WhatsApp Business Cloud API. All values from the environment —
# never literal (FR-012). graph-api-version pins the Graph API URL version.
whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  graph-api-base-url: ${WHATSAPP_GRAPH_API_BASE_URL:https://graph.facebook.com}
  graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v21.0}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  channel:
    poll-interval: ${WHATSAPP_POLL_INTERVAL:PT2S}
    max-attempts: ${WHATSAPP_MAX_ATTEMPTS:5}
    reclaim-after: ${WHATSAPP_RECLAIM_AFTER:PT2M}

# SPEC-012: the owner-preview agent. These are **development** defaults
# (ADR-0009, ADR-0010): a local `ollama serve` with the smallest tool-capable
# model, which proves the round trip and nothing about answer quality. Production
# values are supplied per environment, not committed.
celestia:
  llm:
    base-url: ${CELESTIA_LLM_BASE_URL:http://localhost:11434}
    # Provisional — T043 verifies this model can tool-call at all, and the answer
    # may be another model entirely. Production is llama4:scout (ADR-0009).
    model: "${CELESTIA_LLM_MODEL:qwen2.5:0.5b}"
    fallback-model: "${CELESTIA_LLM_FALLBACK_MODEL:qwen2.5:1.5b}"
    # Short on the dev machine — it is a laptop's RAM, not a dedicated VM. The
    # warm VM sets this long and never pays the cold load (ADR-0010).
    keep-alive: ${CELESTIA_LLM_KEEP_ALIVE:5m}
    max-tool-rounds: ${CELESTIA_LLM_MAX_TOOL_ROUNDS:6}
    # The fault boundary, not the service level: SC-008's 30 seconds is measured
    # end to end on the warm VM (T040) and production tunes this against it.
    turn-deadline: ${CELESTIA_LLM_TURN_DEADLINE:PT60S}
    max-concurrent-turns: ${CELESTIA_LLM_MAX_CONCURRENT_TURNS:1}
  entitlement:
    # EMPTY DENIES EVERYONE (FR-003). The safe default for a key someone will
    # forget to set — an empty list meaning "allow all" is how a configuration
    # slip becomes an open service.
    allow-list: ${CELESTIA_ENTITLEMENT_ALLOW_LIST:}
  turn-record:
    # 0 means never purge on age — which is NOT a way to switch off the
    # "forget me" hard delete (FR-020a, FR-020b).
    retention-days: ${CELESTIA_TURN_RECORD_RETENTION_DAYS:90}

# Phase-specific config (Razorpay) is added in the spec that introduces it.
# See PROJECT_PLAN.md.
