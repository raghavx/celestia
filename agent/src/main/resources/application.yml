spring:
  application:
    name: celestia-agent

  # SPEC-008: MySQL 8.4 via Flyway. Credentials come from the environment
  # (DB_URL / DB_USER / DB_PASSWORD); the defaults are for a local dev MySQL.
  # Secrets are never literal in this file.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/celestia?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:celestia}
    password: ${DB_PASSWORD:celestia}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

  # SPEC-012: Spring AI's own provider switch, driven by the SAME environment
  # variable as celestia.llm.provider so the two can never disagree. Whichever is
  # selected, the autoconfigured chat model is built around TurnToolCallingManager
  # — its factory takes a ToolCallingManager — so the turn stays bounded and
  # recorded either way (ADR-0009, amended 2026-11-24).
  # SPEC-012 T045: the HTTP read timeout is what bounds a single Ollama call —
  # its options carry no per-request timeout, unlike Anthropic's. Keep it at or
  # below celestia.llm.turn-deadline, or a turn is bounded by this instead.
  http:
    clients:
      connect-timeout: ${CELESTIA_HTTP_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${CELESTIA_HTTP_READ_TIMEOUT:PT60S}

  ai:
    # SPEC-012 T045 — THE DEFAULTS HERE CAUSED A 24-MINUTE TURN.
    # Spring AI retries ten times by default, backing off from 2s with a
    # multiplier of 5 and no maximum interval: 2s, 10s, 50s, 250s, 1250s…
    # Nobody chose that, and it makes any turn budget a fiction.
    # ADR-0009 makes the FALLBACK MODEL the response to a failing primary, so a
    # retry underneath it competes with the design rather than supporting it.
    retry:
      max-attempts: ${CELESTIA_LLM_RETRY_ATTEMPTS:1}
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    model:
      chat: ${CELESTIA_LLM_PROVIDER:ollama}
    ollama:
      base-url: ${CELESTIA_LLM_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: "${CELESTIA_LLM_MODEL:qwen2.5:0.5b}"
    anthropic:
      # An API key, NOT a subscription.
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${CELESTIA_LLM_MODEL_ANTHROPIC:claude-sonnet-5}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# SPEC-009: WhatsApp Business Cloud API. All values from the environment —
# never literal (FR-012). graph-api-version pins the Graph API URL version.
whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  graph-api-base-url: ${WHATSAPP_GRAPH_API_BASE_URL:https://graph.facebook.com}
  graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v21.0}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  channel:
    poll-interval: ${WHATSAPP_POLL_INTERVAL:PT2S}
    max-attempts: ${WHATSAPP_MAX_ATTEMPTS:5}
    reclaim-after: ${WHATSAPP_RECLAIM_AFTER:PT2M}

# SPEC-012: the owner-preview agent. These are **development** defaults
# (ADR-0009, ADR-0010): a local `ollama serve` with the smallest tool-capable
# model, which proves the round trip and nothing about answer quality. Production
# values are supplied per environment, not committed.
celestia:
  llm:
    # ollama | anthropic. ADR-0009 (amended 2026-11-24): development runs against
    # the Claude API, because a small local model cannot drive eleven tool
    # definitions at all. Ollama stays the COMMITTED DEFAULT so a clone with no
    # credentials still builds and tests.
    #   export CELESTIA_LLM_PROVIDER=anthropic ANTHROPIC_API_KEY=sk-ant-...
    # An API key, not a subscription.
    provider: ${CELESTIA_LLM_PROVIDER:ollama}
    base-url: ${CELESTIA_LLM_BASE_URL:http://localhost:11434}
    # Provisional — T043 verifies this model can tool-call at all, and the answer
    # may be another model entirely. Production is llama4:scout (ADR-0009).
    model: "${CELESTIA_LLM_MODEL:qwen2.5:0.5b}"
    fallback-model: "${CELESTIA_LLM_FALLBACK_MODEL:qwen2.5:1.5b}"
    # Short on the dev machine — it is a laptop's RAM, not a dedicated VM. The
    # warm VM sets this long and never pays the cold load (ADR-0010).
    keep-alive: ${CELESTIA_LLM_KEEP_ALIVE:5m}
    max-tool-rounds: ${CELESTIA_LLM_MAX_TOOL_ROUNDS:6}
    # The fault boundary, not the service level: SC-008's 30 seconds is measured
    # end to end on the warm VM (T040) and production tunes this against it.
    turn-deadline: ${CELESTIA_LLM_TURN_DEADLINE:PT60S}
    max-concurrent-turns: ${CELESTIA_LLM_MAX_CONCURRENT_TURNS:1}
    # Anthropic only. A ceiling, not a reservation — unused headroom costs
    # nothing, and hitting the cap truncates mid-thought and wastes the turn.
    max-tokens: ${CELESTIA_LLM_MAX_TOKENS:16000}
    # Thinking depth: low | medium | high | xhigh | max, or blank for the API's
    # default. NOT a token budget — Sonnet 5 rejects budget_tokens outright.
    effort: ${CELESTIA_LLM_EFFORT:}
    # Blank reads ANTHROPIC_API_KEY from the environment, which is the usual case.
    api-key: ${CELESTIA_LLM_API_KEY:}
  entitlement:
    # EMPTY DENIES EVERYONE (FR-003). The safe default for a key someone will
    # forget to set — an empty list meaning "allow all" is how a configuration
    # slip becomes an open service.
    allow-list: ${CELESTIA_ENTITLEMENT_ALLOW_LIST:}
  turn-record:
    # 0 means never purge on age — which is NOT a way to switch off the
    # "forget me" hard delete (FR-020a, FR-020b).
    retention-days: ${CELESTIA_TURN_RECORD_RETENTION_DAYS:90}

# Phase-specific config (Razorpay) is added in the spec that introduces it.
# See PROJECT_PLAN.md.
