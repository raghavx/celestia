name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Cache Swiss Ephemeris data
        uses: actions/cache@v4
        with:
          path: ephemeris/src/main/resources/ephe
          key: ephe-${{ hashFiles('scripts/ephe.sha256') }}

      - name: Provision ephemeris data
        run: bash scripts/fetch-ephe.sh

      - name: Build, test, verify
        run: ./mvnw -B -ntp verify

      # SPEC-001 SC-005 / FR-014: the golden-chart output must be identical
      # across OS + arch. Fingerprint the deterministic golden test's inputs
      # (positions are computed fresh each run) and compare across the matrix.
      - name: Golden determinism (cross-OS)
        run: |
          # The real cross-platform check is these tests asserting computed ==
          # stored on each OS; the JSON fingerprint below is a coarse extra guard.
          ./mvnw -q -B -ntp -pl core -am test \
            -Dtest=GoldenChartTest,DeterminismTest,NatalChartGoldenTest,NatalChartDeterminismTest,SignificatorGoldenTest,GrahaSignificatorGoldenTest,NodeAgencyGoldenTest,RulingPlanetsGoldenTest,SignificatorDeterminismTest,RulingPlanetsDeterminismTest,DashaGoldenTest,RunningDashaGoldenTest,DashaWindowGoldenTest,DashaDeterminismTest,Horary249SnapshotTest,HoraryGoldenTest,HoraryRulingPlanetsGoldenTest,HoraryDeterminismTest \
            -Dsurefire.failIfNoSpecifiedTests=false
          find core/src/test/resources/golden -name '*.json' -exec shasum -a 256 {} + \
            | sort > golden-fingerprint-${{ matrix.os }}.txt
          cat golden-fingerprint-${{ matrix.os }}.txt

      - name: Upload golden fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: golden-fingerprint-${{ matrix.os }}
          path: golden-fingerprint-${{ matrix.os }}.txt

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore

      - name: Publish JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore
